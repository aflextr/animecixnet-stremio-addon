name: Portainer Otomatik Dağıtım 

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      packages: write
      contents: read

    steps:
      - name: 1. Kodu Çek
        uses: actions/checkout@v4

      - name: 2. GitHub Container Registry'ye Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.CR_PAT }} 

      - name: 3. Docker İmajını Derle ve GHCR'ye Yükle (Build & Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/aflextr/animecixnet-stremio-addon-image:latest 

      - name: 4. Portainer'ı Tetikle
        if: ${{ secrets.PORTAINER_WEBHOOK != '' }}
        run: |
          if ! curl -k --fail --show-error --silent --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors -X POST "${{ secrets.PORTAINER_WEBHOOK }}"; then
            echo "::warning::Portainer webhook tetiklenemedi. Docker imajı GHCR'ye başarıyla yüklendi."
          fi
